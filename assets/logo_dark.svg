<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A233A"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C48C"/>
      <stop offset="100%" stop-color="#009B77"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Speech Bubble Icon -->
  <g transform="translate(10, 15)">
    <path d="M 24 0 L 96 0 C 109.2 0 120 10.8 120 24 L 120 64 C 120 77.2 109.2 88 96 88 L 44 88 L 24 102 L 24 88 L 24 88 C 10.8 88 0 77.2 0 64 L 0 24 C 0 10.8 10.8 0 24 0 Z" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Bars inside bubble -->
    <rect x="26" y="48" width="12" height="24" rx="6" fill="#7A8CA5"/>
    <rect x="46" y="34" width="12" height="38" rx="6" fill="#8D9CB0"/>
    <rect x="66" y="18" width="14" height="54" rx="7" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <rect x="88" y="40" width="12" height="32" rx="6" fill="#7A8CA5"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(155, 20)">
    <text x="0" y="50" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Auto<tspan fill="#00C48C">Insight</tspan></text>
    <!-- Accent Underline -->
    <rect x="0" y="62" width="340" height="4.5" rx="2.25" fill="url(#emeraldGrad)"/>
    <text x="2" y="82" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="14.5" font-weight="700" fill="#94A3B8" letter-spacing="7">ARAÇ DEĞERLEME</text>
  </g>
</svg>

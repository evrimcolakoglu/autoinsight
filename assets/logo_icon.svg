<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#00A878"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Square Body -->
  <rect x="2" y="2" width="116" height="116" rx="30" fill="url(#iconBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <!-- Bars -->
  <rect x="26" y="65" width="14" height="27" rx="7" fill="#64748B"/>
  <rect x="50" y="47" width="14" height="45" rx="7" fill="#94A3B8"/>
  <rect x="74" y="26" width="16" height="66" rx="8" fill="url(#barGrad)" filter="url(#iconGlow)"/>
</svg>
